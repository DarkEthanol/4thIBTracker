name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and build release
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH. Received: $tag"
          }
          ./scripts/Publish-Release.ps1 `
            -Version $Matches.version `
            -Repository $env:GITHUB_REPOSITORY

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assetDirectory = "artifacts/release/$tag"
          $previousTag = git tag --sort=-v:refname --merged $tag |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and $_ -ne $tag } |
            Select-Object -First 1
          if ($previousTag) {
            $changes = @(git log --format="- %s" "$previousTag..$tag")
          }
          else {
            $changes = @(git log -1 --format="- %s" $tag)
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not generate release notes for $tag."
          }
          if ($changes.Count -eq 0) {
            $changes = @("- Release $tag")
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @("## Changes", "") + $changes |
            Set-Content -LiteralPath $notesFile -Encoding utf8
          gh release create $tag `
            "$assetDirectory/4thIBTracker.exe#4thIB Tracker for Windows x64" `
            "$assetDirectory/4thIBTracker.exe.sha256#SHA-256 checksum" `
            --verify-tag `
            --notes-file $notesFile `
            --latest
