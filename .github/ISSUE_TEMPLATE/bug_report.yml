name: Bug report
description: Report reproducible tracker behaviour.
title: "[Bug]: "
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, OAuth tokens, private sheet IDs, personnel lists, or private forum content.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the sidebar and under Settings → App updates.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: sanitized-errors
    attributes:
      label: Sanitised error text
      description: Remove names, URLs, IDs and credentials before pasting.
